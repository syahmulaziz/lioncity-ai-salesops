name: Deploy Staging to Lightsail

on:
  push:
    branches:
      - staging

  workflow_dispatch:

concurrency:
  group: lioncity-staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy LionCity Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        shell: bash
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/.ssh/lioncity_actions
          chmod 600 ~/.ssh/lioncity_actions

          ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to Lightsail
        shell: bash
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          ssh \
            -i ~/.ssh/lioncity_actions \
            -o BatchMode=yes \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "/home/ubuntu/deploy-lioncity.sh"

      - name: Verify public staging site
        shell: bash
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            https://lioncity.purrpunch.com \
            > /dev/null

          echo "LionCity staging deployment verified."